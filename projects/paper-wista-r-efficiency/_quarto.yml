project:
  type: book
  title: "WISTA Article Project"
  output-dir: _book

book:
  title: "Effizienzanalyse statistischer Verfahren in der amtlichen Statistik"
  subtitle: "Eine empirische Untersuchung am Beispiel der Datenverarbeitung"
  author: 
    - name: "Max Mustermann"
      affiliations:
        - name: "Statistisches Bundesamt"
          department: "Abteilung für methodische Grundsatzfragen"
    - name: "Dr. Anna Schmidt"
      affiliations:
        - name: "Universität München"
          department: "Institut für Statistik"
  date: today
  chapters:
    - index.qmd
    - sections/methodology.qmd
    - sections/results.qmd

bibliography: references.bib
  
format:
  pdf:
    documentclass: article
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=2.5cm
      - right=2.5cm
    fontsize: 10pt
    linestretch: 1.1
    cite-method: biblatex
    biblio-style: authoryear
    biblatexoptions: 
      - backend=biber
      - style=authoryear-comp
      - uniquename=false
      - uniquelist=false
    keep-tex: true

    include-in-header:
      text: |
        \usepackage{csquotes}
        \usepackage{booktabs}
        \usepackage{array}
        \usepackage{multirow}
        \usepackage{wrapfig}
        \usepackage{float}
        \usepackage{colortbl}
        \usepackage{pdflscape}
        \usepackage{threeparttable}
        \usepackage{threeparttablex}
        \usepackage[normalem]{ulem}
        \usepackage{makecell}
        \usepackage{xcolor}
        \usepackage{multicol}
        \usepackage{fancyhdr}
        \usepackage{titlesec}
        \usepackage{etoolbox}
        \usepackage{tabularx}
        \usepackage{afterpage}
        
        % Define WISTA colors (brighter blue)
        \definecolor{wistaBlue}{RGB}{30,110,180}
        \definecolor{wistaLightBlue}{RGB}{51,153,204}
        \definecolor{wistaDarkGray}{RGB}{64,64,64}
        \definecolor{wistaLightGray}{RGB}{128,128,128}
        
        % Custom section formatting for WISTA style
        % Use the nice subsection style for main sections (highest level)
        \titleformat{\section}
          {\color{wistaDarkGray}\large\bfseries}
          {\color{wistaBlue}\large\bfseries\thesection}
          {0.5em}
          {\color{wistaDarkGray}\large\bfseries}
          [\vspace{0.1cm}\noindent{\color{wistaBlue}\rule{\columnwidth}{1pt}}\vspace{0.2cm}]
        
        % Smaller formatting for subsections
        \titleformat{\subsection}
          {\color{wistaDarkGray}\normalsize\bfseries}
          {\color{wistaBlue}\normalsize\bfseries\thesubsection}
          {0.5em}
          {\color{wistaDarkGray}\normalsize\bfseries}
          [\vspace{0.1cm}\noindent{\color{wistaBlue}\rule{0.5\columnwidth}{0.5pt}}\vspace{0.15cm}]
          
        % Even smaller for subsubsections  
        \titleformat{\subsubsection}
          {\color{wistaDarkGray}\small\bfseries}
          {\color{wistaBlue}\small\bfseries\thesubsubsection}
          {0.3em}
          {\color{wistaDarkGray}\small\bfseries}
        
        % Header and footer setup
        \pagestyle{fancy}
        \fancyhf{} % Clear all header and footer fields
        \fancyhead[LE]{\small\textit{Max Mustermann, Dr. Anna Schmidt}}
        \fancyhead[RO]{\small\textit{Effizienzanalyse statistischer Verfahren}}
        \fancyfoot[LE]{\small\thepage}
        \fancyfoot[RE]{\small Statistisches Bundesamt | WISTA | {\color{wistaBlue}6} | 2025}
        \fancyfoot[LO]{\small Statistisches Bundesamt | WISTA | {\color{wistaBlue}6} | 2025}
        \fancyfoot[RO]{\small\thepage}
        \renewcommand{\headrulewidth}{0pt}
        \renewcommand{\footrulewidth}{0pt}
        
        % Set up multicol parameters
        \setlength{\columnsep}{1cm}
        \setlength{\columnseprule}{0pt}
        
        % Environment for full-width content
        \newenvironment{fullwidth}{%
          \end{multicols}%
          \vspace{0.5cm}%
        }{%
          \vspace{0.5cm}%
          \begin{multicols}{2}%
        }
        
        % Command to start main content in two columns
        \newcommand{\startmaintext}{%
          \begin{multicols}{2}%
        }
        
        % Command to end two-column layout
        \newcommand{\endmaintext}{%
          \end{multicols}%
        }

execute:
  freeze: auto
  
editor: visual

lang: de