project:
  type: book
  title: "WISTA Article Project"
  output-dir: _book
  post-render:
    - "bash -c 'git add _book/*.pdf && git commit -m \"Update PDF $(date +%Y-%m-%d_%H:%M)\" && git push || true'"

book:
  title: "Effizienzanalyse statistischer Verfahren in der amtlichen Statistik"
  subtitle: "Eine empirische Untersuchung am Beispiel der Datenverarbeitung"
  author: 
    - name: "Max Mustermann"
      affiliations:
        - name: "Statistisches Bundesamt"
          department: "Abteilung für methodische Grundsatzfragen"
    - name: "Dr. Anna Schmidt"
      affiliations:
        - name: "Universität München"
          department: "Institut für Statistik"
  date: today
  chapters:
    - index.qmd
    - sections/01-einleitung.qmd
    - sections/02-btp.qmd
    - sections/03-infrastruktur.qmd
    - sections/04-methoden.qmd
    - sections/05-performance.qmd
    - sections/06-ausblick.qmd

bibliography: references.bib
  
format:
  pdf:
    documentclass: book
    classoption:
      - twocolumn
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=2cm
      - right=2cm
    fontsize: 10pt
    linestretch: 1.1
    cite-method: biblatex
    biblio-style: authoryear
    biblatexoptions: 
      - backend=biber
      - style=authoryear-comp
      - uniquename=false
      - uniquelist=false
    keep-tex: true

    include-in-header:
      text: |
        \usepackage{csquotes}
        \usepackage{booktabs}
        \usepackage{array}
        \usepackage{multirow}
        \usepackage{wrapfig}
        \usepackage{float}
        \usepackage{colortbl}
        \usepackage{pdflscape}
        \usepackage{threeparttable}
        \usepackage{threeparttablex}
        \usepackage[normalem]{ulem}
        \usepackage{makecell}
        \usepackage{xcolor}
        \usepackage{multicol}
        \usepackage{fancyhdr}
        \usepackage{titlesec}
        \usepackage{etoolbox}
        \usepackage{tabularx}
        \usepackage{afterpage}
        
        % Define WISTA colors (brighter blue)
        \definecolor{wistaBlue}{RGB}{30,110,180}
        \definecolor{wistaLightBlue}{RGB}{51,153,204}
        \definecolor{wistaDarkGray}{RGB}{64,64,64}
        \definecolor{wistaLightGray}{RGB}{128,128,128}
        
        % Custom chapter formatting - number on top with column-width rule  
        \titleformat{\chapter}[display]
          {\normalfont\huge\bfseries\color{wistaDarkGray}}
          {\color{wistaBlue}\large\chaptertitlename\ \thechapter\vspace{0.2cm}\\\noindent\rule{\columnwidth}{1.5pt}}
          {0.5cm}
          {\Huge\color{wistaDarkGray}}
          [\vspace{0.2cm}\noindent{\color{wistaBlue}\rule{\columnwidth}{1pt}}\vspace{0.5cm}]
        \titlespacing*{\chapter}{0pt}{-20pt}{20pt}
        
        % Custom section formatting - number on top with column-width underline
        \titleformat{\section}[display]
          {\normalfont\large\bfseries}
          {\color{wistaBlue}\large\bfseries\thesection\vspace{0.1cm}\\\noindent\rule{\columnwidth}{1pt}}
          {0.3cm}
          {\color{wistaDarkGray}\large\bfseries}
          [\vspace{0.1cm}\noindent{\color{wistaBlue}\rule{\columnwidth}{0.5pt}}\vspace{0.3cm}]
        \titlespacing*{\section}{0pt}{1.5ex plus 1ex minus .2ex}{1ex plus .2ex}
        
        % Smaller formatting for subsections (within columns)
        \titleformat{\subsection}
          {\color{wistaDarkGray}\normalsize\bfseries}
          {\color{wistaBlue}\normalsize\bfseries\thesubsection}
          {0.5em}
          {\color{wistaDarkGray}\normalsize\bfseries}
          [\vspace{0.05cm}\noindent{\color{wistaBlue}\rule{0.5\columnwidth}{0.4pt}}\vspace{0.1cm}]
          
        % Even smaller for subsubsections  
        \titleformat{\subsubsection}
          {\color{wistaDarkGray}\small\bfseries}
          {\color{wistaBlue}\small\bfseries\thesubsubsection}
          {0.3em}
          {\color{wistaDarkGray}\small\bfseries}
        
        % Header and footer setup
        \pagestyle{fancy}
        \fancyhf{} % Clear all header and footer fields
        \fancyhead[LE]{\small\textit{Max Mustermann, Dr. Anna Schmidt}}
        \fancyhead[RO]{\small\textit{Effizienzanalyse statistischer Verfahren}}
        \fancyfoot[LE]{\small\thepage}
        \fancyfoot[RE]{\small Statistisches Bundesamt | WISTA | {\color{wistaBlue}6} | 2025}
        \fancyfoot[LO]{\small Statistisches Bundesamt | WISTA | {\color{wistaBlue}6} | 2025}
        \fancyfoot[RO]{\small\thepage}
        \renewcommand{\headrulewidth}{0pt}
        \renewcommand{\footrulewidth}{0pt}
        
        % Make all figures and tables span both columns (full width)
        % Redefine figure environment to use figure*
        \let\origfigure\figure
        \let\endorigfigure\endfigure
        \renewenvironment{figure}[1][htbp]{%
          \origfigure*[#1]%
        }{%
          \endorigfigure*%
        }
        
        % Redefine table environment to use table*
        \let\origtable\table
        \let\endorigtable\endtable
        \renewenvironment{table}[1][htbp]{%
          \origtable*[#1]%
        }{%
          \endorigtable*%
        }
        

        


execute:
  freeze: auto
  
editor: visual

lang: de