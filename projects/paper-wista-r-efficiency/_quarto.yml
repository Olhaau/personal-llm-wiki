project:
  type: default
  output-dir: _book
  render:
    - index.qmd
  post-render:
    - bash -c "git add _book/*.pdf && git commit -m 'Update PDF' && git push || true"

title: "Effizienzanalyse statistischer Verfahren in der amtlichen Statistik"
subtitle: "Eine empirische Untersuchung am Beispiel der Datenverarbeitung"
author: 
  - name: "Oliver Hauke"
    affiliations:
      - name: "Statistisches Bundesamt"
  - name: "Annette Kristiansen"
    affiliations:
      - name: "Statistisches Bundesamt"
date: today

bibliography: references.bib
  
format:
  pdf:
    documentclass: article
    output-file: "Effizienzanalyse-statistischer-Verfahren.pdf"
    classoption:
      - twocolumn
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=2cm
      - right=2cm
    fontsize: 10pt
    linestretch: 1.0
    number-sections: true
    cite-method: biblatex
    biblio-style: authoryear
    biblatexoptions: 
      - backend=biber
      - style=authoryear-comp
      - uniquename=false
      - uniquelist=false
    keep-tex: true
    include-before-body:
      - title.tex
    title-block-style: none

    include-in-header:
      text: |
        \usepackage{csquotes}
        \usepackage{booktabs}
        \usepackage{array}
        \usepackage{multirow}
        \usepackage{wrapfig}
        \usepackage{float}
        \usepackage{colortbl}
        \usepackage{pdflscape}
        \usepackage{threeparttable}
        \usepackage{threeparttablex}
        \usepackage[normalem]{ulem}
        \usepackage{makecell}
        \usepackage{xcolor}
        \usepackage{multicol}
        \usepackage{fancyhdr}
        \usepackage{titlesec}
        \usepackage{etoolbox}
        \usepackage{tabularx}
        \usepackage{afterpage}
        \usepackage{tikz}
        
        % Define WISTA colors
        \definecolor{wistaBlue}{RGB}{30,110,180}
        \definecolor{wistaLightBlue}{RGB}{80,140,200}
        \definecolor{wistaDarkGray}{RGB}{64,64,64}
        \definecolor{wistaLightGray}{RGB}{128,128,128}
        
        % Custom section formatting - number on top with column-width underline
        \titleformat{\section}[display]
          {\normalfont\large\bfseries}
          {\color{wistaBlue}\large\bfseries\thesection\vspace{0.1cm}\\\noindent\rule{\columnwidth}{1pt}}
          {0.3cm}
          {\color{wistaDarkGray}\large\bfseries}
          [\vspace{0.1cm}\noindent{\color{wistaBlue}\rule{\columnwidth}{0.5pt}}\vspace{0.3cm}]
        \titlespacing*{\section}{0pt}{2ex plus 1ex minus .2ex}{1ex plus .2ex}
        
        % Subsection formatting - number and title with underline
        \titleformat{\subsection}
          {\color{wistaDarkGray}\normalsize\bfseries}
          {\color{wistaBlue}\normalsize\bfseries\thesubsection}
          {0.5em}
          {\color{wistaDarkGray}\normalsize\bfseries}
          [\vspace{0.05cm}\noindent{\color{wistaBlue}\rule{0.5\columnwidth}{0.4pt}}\vspace{0.1cm}]
          
        % Subsubsection formatting
        \titleformat{\subsubsection}
          {\color{wistaDarkGray}\small\bfseries}
          {\color{wistaBlue}\small\bfseries\thesubsubsection}
          {0.3em}
          {\color{wistaDarkGray}\small\bfseries}
        
        % Paragraph formatting (4th level)
        \titleformat{\paragraph}[runin]
          {\color{wistaDarkGray}\normalsize\bfseries}
          {}
          {0em}
          {}
          [.]
        \titlespacing*{\paragraph}{0pt}{1ex plus 0.5ex minus 0.2ex}{0.5em}
        
        % Header and footer setup with blue line under header
        \pagestyle{fancy}
        \fancyhf{}
        \fancyhead[L]{\small\textit{Oliver Hauke, Annette Kristiansen}}
        \fancyhead[R]{\small\textit{Effizienzanalyse statistischer Verfahren}}
        \fancyfoot[L]{\small Statistisches Bundesamt | WISTA | {\color{wistaBlue}6} | 2025}
        \fancyfoot[R]{\small\thepage}
        \renewcommand{\headrulewidth}{0pt}
        \renewcommand{\footrulewidth}{0pt}
        % Add blue line under header
        \renewcommand{\headrule}{\color{wistaBlue}\hrule width\headwidth height 1pt \vskip 2pt}
        \renewcommand{\headrulewidth}{1pt}
        
        % Make all figures and tables span both columns (full width)
        \let\origfigure\figure
        \let\endorigfigure\endfigure
        \renewenvironment{figure}[1][htbp]{%
          \origfigure*[#1]%
        }{%
          \endorigfigure*%
        }
        
        \let\origtable\table
        \let\endorigtable\endtable
        \renewenvironment{table}[1][htbp]{%
          \origtable*[#1]%
        }{%
          \endorigtable*%
        }
        
        % Footnotes stay within column
        \usepackage[stable]{footmisc}
        
        % Custom bullet points with ">"
        \usepackage{enumitem}
        \setlist[itemize]{label={\color{wistaBlue}\textgreater}, leftmargin=1.5em, itemsep=0pt, parsep=0pt}
        
        % Blue arrow for cross-references (bottom-right arrow)
        \usepackage{amssymb}
        
        % Redefine ref to include blue arrow for figure/table/section references
        \let\oldref\ref
        \renewcommand{\ref}[1]{{\color{wistaBlue}$\searrow$}\oldref{#1}}
        

        


execute:
  freeze: auto
  
editor: visual

lang: de