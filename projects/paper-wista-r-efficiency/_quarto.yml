project:
  type: default
  output-dir: _book
  render:
    - index.qmd
  post-render:
    - bash -c "git add _book/*.pdf && git commit -m 'Update PDF' && git push || true"

bibliography: references.bib
  
format:
  docx:
    output-file: "Effiziente-Analyse-Forschungsdaten-R.docx"
    reference-doc: reference.docx
    number-sections: true
    toc: false
    highlight-style: github
    filters:
      - section-break.lua
  pdf:
    title: "Effiziente Analyse großer Forschungsdaten mithilfe von R"
    author: 
      - name: "Oliver Hauke"
        affiliations:
          - name: "Statistisches Bundesamt"
      - name: "Annette Kristiansen"
        affiliations:
          - name: "Statistisches Bundesamt"
    date: today
    documentclass: article
    output-file: "Effiziente-Analyse-Forschungsdaten-R.pdf"
    classoption:
      - twocolumn
      - twoside
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=2cm
      - right=2cm
    fontsize: 10pt
    linestretch: 1.0
    number-sections: true
    cite-method: biblatex
    biblio-style: authoryear
    biblatexoptions: 
      - backend=biber
      - style=authoryear-comp
      - uniquename=false
      - uniquelist=false
    keep-tex: true
    include-before-body:
      - title.tex
    title-block-style: none
    pandoc:
      variables:
        tables: false

    include-in-header:
      text: |
        \usepackage{csquotes}
        \usepackage{booktabs}
        \usepackage{array}
        \usepackage{multirow}
        \usepackage{wrapfig}
        \usepackage{float}
        \usepackage{colortbl}
        \usepackage{pdflscape}
        \usepackage{threeparttable}
        \usepackage{threeparttablex}
        \usepackage[normalem]{ulem}
        \usepackage{makecell}
        \usepackage{xcolor}
        \usepackage{multicol}
        \usepackage{fancyhdr}
        \usepackage{titlesec}
        \usepackage{etoolbox}
        \usepackage{tabularx}
        \usepackage{afterpage}
        \usepackage{tikz}
        

        
        % Suppress default maketitle
        \renewcommand{\maketitle}{}
        
        % Define WISTA colors (Havelock Blue as main)
        \definecolor{wistaBlue}{RGB}{65,125,180}
        \definecolor{wistaLightBlue}{RGB}{120,170,215}
        \definecolor{wistaDarkGray}{RGB}{64,64,64}
        \definecolor{wistaLightGray}{RGB}{128,128,128}
        
        % Custom section formatting - number on top with column-width underline
        \titleformat{\section}[display]
          {\normalfont\large\bfseries}
          {\color{wistaBlue}\large\bfseries\thesection\vspace{-0.2cm}\\\noindent\rule{\columnwidth}{1pt}}
          {0.02cm}
          {\color{wistaDarkGray}\large\bfseries}
          [\vspace{-0.2cm}\noindent{\color{wistaBlue}\rule{\columnwidth}{0.5pt}}\vspace{0.08cm}]
        \titlespacing*{\section}{0pt}{0.8ex plus 0.2ex minus .1ex}{0.2ex plus .1ex}
        
        % Subsection formatting - number and title with underline, bigger and dark grey
        \titleformat{\subsection}
          {\color{wistaDarkGray}\large\bfseries}
          {\color{wistaDarkGray}\large\bfseries\thesubsection}
          {0.5em}
          {\color{wistaDarkGray}\large\bfseries}
          [\vspace{-0.2cm}\noindent{\color{wistaBlue}\rule{\columnwidth}{0.4pt}}\vspace{0.03cm}]
          
        % Subsubsection formatting
        \titleformat{\subsubsection}
          {\color{wistaDarkGray}\small\bfseries}
          {\color{wistaBlue}\small\bfseries\thesubsubsection}
          {0.3em}
          {\color{wistaDarkGray}\small\bfseries}
        
        % Paragraph formatting (4th level)
        \titleformat{\paragraph}[runin]
          {\color{wistaDarkGray}\normalsize\bfseries}
          {}
          {0em}
          {}
          [.]
        \titlespacing*{\paragraph}{0pt}{1ex plus 0.5ex minus 0.2ex}{0.5em}
        
        % Header and footer setup with blue line under header
        \pagestyle{fancy}
        \fancyhf{}
        \fancyhead[L]{\small\textit{Oliver Hauke, Annette Kristiansen}}
        \fancyhead[R]{\small\textit{Effiziente Analyse großer Forschungsdaten}}
        \fancyfoot[L]{\small\thepage}
        \fancyfoot[R]{\small Statistisches Bundesamt | WISTA | {\color{wistaBlue}6} | 2025}
        \renewcommand{\headrulewidth}{0pt}
        \renewcommand{\footrulewidth}{0pt}
        % Add blue line under header
        \renewcommand{\headrule}{\color{wistaBlue}\hrule width\headwidth height 1pt \vskip 2pt}
        \renewcommand{\headrulewidth}{1pt}
        
        % Make all figures span both columns (full width)
        \let\origfigure\figure
        \let\endorigfigure\endfigure
        \renewenvironment{figure}[1][htbp]{%
          \origfigure*[#1]%
        }{%
          \endorigfigure*%
        }
        
        % Make bibliography full-width (one column) - for biblatex
        \defbibheading{bibliography}[\bibname]{%
          \onecolumn
          \section*{#1}%
          \markboth{#1}{#1}%
        }
        

        
        % Footnotes stay within column
        \usepackage[stable]{footmisc}
        
        % Pifont for dingbat symbols
        \usepackage{pifont}
        
        % Completely disable problematic table elements for two-column mode
        \usepackage{array,tabularx,calc}
        \makeatletter
        % Replace longtable with simple tabular
        \renewenvironment{longtable}{\@ifnextchar[{\@longtable}{\@longtable[c]}}{\end{tabular}}
        \def\@longtable[#1]#2{\begin{tabular}{*{10}{l}}} % Use up to 10 left-aligned columns
        % Disable all longtable-specific commands
        \let\endhead\@empty
        \let\endfirsthead\@empty
        \let\endfoot\@empty
        \let\endlastfoot\@empty
        \let\tabularnewline\\
        % Completely replace booktabs rules with simple versions
        \renewcommand{\toprule}{\relax}
        \renewcommand{\midrule}{\relax}
        \renewcommand{\bottomrule}{\relax}
        % Create commands to absorb problematic table commands
        \def\noalign#1{}
        % Handle caption commands outside floats by redefining after caption package loads
        \AtBeginDocument{
          \let\oldcaption\caption
          \renewcommand{\caption}[1]{\par\noindent\textbf{#1}\par}
        }
        \makeatother
        
        % Custom bullet points with > character - 35% width, 95% height, black extra bold, half line spacing
        \usepackage{enumitem}
        \setlist[itemize]{label={\scalebox{0.35}[0.95]{\fontseries{bx}\selectfont >}}, leftmargin=1.5em, itemsep=5pt, topsep=3pt, parsep=0pt}
        
        % Redefine ref to include pifont 247 (arrow) for figure/table/section references
        \let\oldref\ref
        \renewcommand{\ref}[1]{{\color{wistaBlue}\ding{247}}\oldref{#1}}
        

        


execute:
  freeze: auto
  
editor: visual

lang: de
babel-lang: german
polyglossia-lang:
  name: german
polyglossia-otherlangs:
  - name: english