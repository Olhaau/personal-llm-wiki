# Destatis Corporate Design Configuration
# This file defines styling for Excel exports following Destatis guidelines

# Font settings
font:
  family: "Arial"
  size: 10
  color: "000000"  # Black

# Destatis color palette
colors:
  primary: "004B76"      # Destatis blue (dark)
  secondary: "0080C8"    # Destatis blue (light)
  background: "E6F2F8"   # Light blue background
  white: "FFFFFF"
  grey_light: "F2F2F2"
  grey_dark: "808080"
  text: "000000"

# Heading style (top heading row)
heading:
  font_family: "Arial"
  font_size: 14
  font_bold: true
  font_color: "FFFFFF"      # White text
  fill_color: "004B76"      # Destatis dark blue
  horizontal_align: "left"
  vertical_align: "center"
  wrap_text: false
  row_height: 25

# Column header style (table headers)
column_header:
  font_family: "Arial"
  font_size: 10
  font_bold: true
  font_color: "000000"      # Black text
  fill_color: "E6F2F8"      # Light blue background
  horizontal_align: "center"
  vertical_align: "center"
  wrap_text: true
  border: true
  border_color: "004B76"

# Data cell style
data_cell:
  font_family: "Arial"
  font_size: 10
  font_bold: false
  font_color: "000000"
  fill_color: "FFFFFF"
  horizontal_align: "left"
  vertical_align: "center"
  wrap_text: false
  border: true
  border_color: "D9D9D9"   # Light grey borders

# Alternating row colors
alternating_rows:
  enabled: true
  odd_color: "FFFFFF"
  even_color: "F8F8F8"

# Index sheet style
index_sheet:
  name: "Index"
  title: "Report Index"
  font_size: 12
  font_bold: true
  link_color: "0563C1"      # Standard hyperlink blue

# Column width settings
column_width:
  default: 15
  auto_size: true
  max_width: 50

# Row settings
row_height:
  default: 15
  auto_size: false

# Freeze panes defaults
freeze_panes:
  rows: 2    # Freeze heading + header row
  cols: 1    # Freeze first column
