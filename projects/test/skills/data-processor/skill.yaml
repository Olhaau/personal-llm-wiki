---
name: "DataProcessor"
version: "1.0.0"
description: "Comprehensive data processing skill demonstrating modular opencode.ai capabilities"
author: "OpenCode.ai Development Team"
category: "data-processing"

metadata:
  created: "2025-01-21"
  updated: "2025-01-21"
  stability: "stable"
  complexity: "intermediate"

# Skill Configuration
capabilities:
  - data_transformation
  - format_conversion
  - validation
  - aggregation
  - analysis
  - export

# Input/Output Types
interfaces:
  input:
    - type: "csv"
      description: "CSV files with structured data"
    - type: "json"
      description: "JSON objects and arrays"
    - type: "excel"
      description: "Excel workbooks (.xlsx, .xls)"
    - type: "dataframe"
      description: "Pandas DataFrames or R data.frames"
    - type: "api_response"
      description: "REST API response data"

  output:
    - type: "processed_data"
      description: "Cleaned and transformed datasets"
    - type: "analytics_report"
      description: "Statistical analysis and insights"
    - type: "visualizations"
      description: "Charts and graphs"
    - type: "export_files"
      description: "Multiple format exports"

# Dependencies
requirements:
  python:
    - pandas>=2.0.0
    - numpy>=1.20.0
    - matplotlib>=3.5.0
    - seaborn>=0.11.0
    - openpyxl>=3.0.0
    - requests>=2.25.0
  
  r:
    - dplyr>=1.1.0
    - readr>=2.1.0
    - ggplot2>=3.4.0
    - openxlsx2>=1.0.0

# Configuration Options
parameters:
  data_validation:
    strict_mode: true
    null_handling: "drop"  # drop, fill, raise
    type_coercion: true
    
  processing:
    chunk_size: 10000
    parallel_processing: true
    memory_optimization: true
    
  output:
    format_options:
      decimal_places: 2
      date_format: "YYYY-MM-DD"
      number_format: "locale"
    compression: "auto"
    include_metadata: true

# Quality Metrics
quality_standards:
  data_integrity: 99.9%
  processing_speed: "<30s for 100k rows"
  memory_efficiency: "<1GB for 1M rows"
  test_coverage: 95%

# Examples of Usage
examples:
  - name: "CSV Processing"
    description: "Load, clean, and analyze CSV data"
    code: |
      processor = DataProcessor()
      data = processor.load_csv("sales_data.csv")
      cleaned = processor.clean_data(data)
      insights = processor.analyze(cleaned)
      
  - name: "Multi-format Export"
    description: "Export processed data to multiple formats"
    code: |
      processor.export_data(
        data=processed_data,
        formats=["csv", "xlsx", "json"],
        destination="output/"
      )

# Integration Points
integrations:
  agents:
    - name: "CodeArchitect"
      purpose: "Use for code generation and review of data processing scripts"
    - name: "ReportGenerator"
      purpose: "Generate documentation from processing results"
      
  skills:
    - name: "Visualization"
      purpose: "Create charts from processed data"
    - name: "DatabaseConnector"  
      purpose: "Store/retrieve processed data"

# Governance and Compliance
governance:
  data_privacy: "GDPR compliant"
  security: "Enterprise grade"
  audit_trail: "Complete operation logging"
  version_control: "Semantic versioning"